name: Refresh official market data
on:
  schedule:
    - cron: '23 7 * * *'
    - cron: '31 8 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh monthly ECB observations
        run: node scripts/update-rates.mjs
      - name: Refresh quarterly house prices
        run: node scripts/update-prices.mjs
      - name: Refresh NRW reference files monthly (or manually)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '31 8 1 * *'
        run: node scripts/update-nrw.mjs
      - run: npm test
      - run: npm run build
      - name: Commit validated observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --staged --quiet; then
            git commit -m 'data: refresh official market observations'
            git push
          fi
      # GITHUB_TOKEN commits do not trigger push workflows. Deploy the updated snapshot here.
      - name: Build the current deployment
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
